name: Clean up workflow runs

on:
    schedule:
        - cron: '17 3 * * 1'
    workflow_dispatch:

permissions: {}

jobs:
    cleanup:
        name: Delete runs older than a week
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            # Keeps, for each workflow, its last successful run and every run since, however old, so the latest result
            # always stays visible; a workflow that has never succeeded keeps all its runs. Of the rest, only completed
            # runs more than a week old are deleted. Uses this repository's own token, which has its own hourly API
            # allowance, so the owner's personal allowance is never touched. GitHub deletes runs one call at a time; the
            # cap keeps a large backlog within that allowance, and the rest goes on the next run.
            - name: Delete completed runs older than a week
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
                  gh api --paginate --slurp "repos/$REPOSITORY/actions/runs?per_page=100" \
                      | jq -r --arg cutoff "$cutoff" '
                          [.[].workflow_runs[]] as $runs
                          | ($runs | map(select(.conclusion == "success")) | group_by(.workflow_id)
                              | map({ key: (.[0].workflow_id | tostring), value: (map(.created_at) | max) }) | from_entries) as $lastSuccess
                          | $runs[]
                          | ($lastSuccess[.workflow_id | tostring]) as $keepFrom
                          | select(.status == "completed" and .created_at < $cutoff and $keepFrom != null and .created_at < $keepFrom)
                          | .id' \
                      | head -n 900 \
                      | while read -r run_id; do
                          gh api --method DELETE "repos/$REPOSITORY/actions/runs/$run_id" --silent
                      done
