name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            # TODO: When the Node version below ships with npm 12, keep only the later 'Setup Node with npm cache' step, renamed
            # 'Setup Node', and remove this step and 'Setup npm'. Until then Node is set up twice: first without the cache,
            # because setup-node checks the cache with the npm bundled with Node (11), which 'devEngines' in package.json rejects.
            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            # Run outside the checkout, as 'devEngines' rejects the bundled npm there too.
            - name: Setup npm
              run: npm install -g npm@12
              working-directory: ${{ runner.temp }}

            # The same Node again, now with npm 12, so the npm cache can be used.
            - name: Setup Node with npm cache
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish
              run: npm publish --provenance
